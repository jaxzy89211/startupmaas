# HedgeWise configuration: every modelling assumption in one place.
# Loaded once by hedgewise/config.py (override the file with the HEDGEWISE_CONFIG environment variable).
# Changing a value here changes results; every output records a hash of this file (see hedgewise/provenance.py).
# Floats with an exponent must be written like 1.0e-06 (YAML 1.1 reads "1e-6" as text).

data:
  start_date: "2019-01-01"        # first day of price history used
  gas_lag_days: 3                 # price frame may run this many days past the last gas quote (weekend gap)

units:
  mwh_per_m3: 0.009769            # Dutch natural gas, 35.17 MJ/m3 (upper heating value) -> MWh
  mwh_per_gj: 0.2778              # 1 GJ = 0.2778 MWh

fixed_price:
  premium: 0.05                   # stand-in for a forward curve: fixed price = 30-day mean spot x (1 + 5%)
  lookback_days: 30               # window of that spot mean
  anchor_to_forward: true         # market sets the price level (fixed price / (1+premium)), the model sets the risk

model:
  variance: garch_t               # gas/CO2 volatility model: garch_t (default) | gjr_t | garch_jump.
                                  # Chosen ONLY on the out-of-sample validation (validation.py, METHODOLOGY.md).
                                  # Validation 23 Nov 2026 (data to 2026-11-23): KEPT garch_t. No variant had 12-month
                                  # coverage in 80-95% (all 68-72%) and none was >3% better on 12-month CRPS (best +0.1%).

garch:                            # GARCH(1,1) with Student-t errors, fitted by maximum likelihood (Nelder-Mead)
  start_values:                   # (alpha, beta, nu) starting points; the best of the three fits is kept
    - [0.08, 0.90, 5]
    - [0.15, 0.80, 4]
    - [0.05, 0.93, 8]
  max_persistence: 0.999          # alpha + beta must stay below this (stationary variance)
  nu_min: 2.1                     # Student-t degrees of freedom search range
  nu_max: 100
  maxiter: 4000                   # optimiser settings
  xatol: 1.0e-08
  fatol: 1.0e-06
  trading_days_per_year: 252      # to annualise volatility in reports

power_model:
  fit_days: 730                   # window for the power-on-gas regression (2 years)
  price_floor: 5.0                # EUR/MWh, floor before taking logs (11 negative-price days since 2019)
  nu_bounds: [2.2, 60]            # search range for the innovations' degrees of freedom
  phi_max: 0.99                   # AR(1) persistence cap

fit:
  min_history_days: 250           # refuse to fit on less than ~1 year of data
  min_corr_obs: 60                # fewer common days -> assume uncorrelated shocks
  min_eigenvalue: 1.0e-06         # floor when repairing the correlation matrix

simulation:
  n_paths: 10000                  # Monte Carlo scenarios for the CLI and the report
  seed: 42                        # random seed: same seed + same data + same config = same numbers
  nu_min: 4.0                     # simulate with at least 4 degrees of freedom (nu<4 has infinite kurtosis)
  max_daily_vol: 0.10             # cap simulated daily gas/CO2 volatility at 10% (~160%/yr)
  spike_headroom: 1.25            # power residual may go 25% beyond its historical range

optimiser:
  objective: mean_variance        # "mean_variance" (interior hedge ratios) or "mean_es" (v0.2, always 0% or 100%)
  same_ratio: true                # one hedge ratio for gas and power (clearer advice; per-commodity costs <0.5% objective)
  risk_aversion: 0.5              # default gamma
  hedge_grid_step: 0.05           # hedge ratios tried: 0%, 5%, ..., 100%
  risk_quantile: 0.95             # VaR / Expected Shortfall level
  max_tranches: 6                 # monthly tranches before delivery (at most)
  same_month_days: 7              # a month starting within this many days of the as-of date counts as "now"
  budget_margin: 0.20             # budget "auto" = last 12 months' bill + 20%
  budget_lookback_days: 365       # "last 12 months" for budget "auto"

policy:
  max_step: 0.20                  # HedgeWise policy: target may rise at most 20 points between monthly dates.
                                  # Reason: 6 monthly dates = 5 steps, 5 x 20 = 100%; NOT tuned on the backtest.

strategies:
  partial_fixed_share: 0.6        # the "Fix 60% now" comparison strategy (and stress test)

stress:
  year: 2022                      # the crisis year that is replayed
  prev_year: 2021                 # the year before (for the "shock as big as 2021->2022" scenario)

solar:
  yield_kwh_per_kwp: 900          # typical for south-east Netherlands
  monthly_share: [3.0, 4.5, 8.0, 11.0, 13.0, 14.0, 14.0, 11.5, 9.0, 6.5, 3.5, 2.0]   # % of yearly yield, Jan..Dec

company_default:                  # the hypothetical company used when no consumption data is given
  name: "Limburg food processor (hypothetical)"
  gas_m3_per_year: 1200000        # process steam (flat) + space heating (winter)
  gas_monthly_share_pct: [11.5, 10.5, 9.5, 8.0, 7.0, 6.0, 5.5, 5.5, 6.5, 8.0, 10.0, 12.0]
  power_kwh_per_year: 5000000     # flat production with a small summer cooling bump
  power_monthly_share_pct: [8.2, 7.6, 8.3, 8.1, 8.4, 8.5, 8.9, 8.8, 8.4, 8.4, 8.2, 8.2]

# Seasonal profiles per sector: % of the yearly volume per month (Jan..Dec).
# THESE ARE ASSUMPTIONS (typical shapes, not measured data). Replace them with interview or pilot data.
#   food processing : process steam all year + space heating in winter; flat power, small summer cooling bump
#   metal           : mostly process heat (mildly seasonal); flat power with an August holiday dip
#   greenhouse      : heating-dominated gas (CHP), strong winter peak; power for grow lights in winter
#   offices         : gas almost only for space heating; nearly flat power, small summer holiday dip
sector_profiles:
  food processing:
    gas:   [11.5, 10.5, 9.5, 8.0, 7.0, 6.0, 5.5, 5.5, 6.5, 8.0, 10.0, 12.0]
    power: [8.2, 7.6, 8.3, 8.1, 8.4, 8.5, 8.9, 8.8, 8.4, 8.4, 8.2, 8.2]
  metal:
    gas:   [9.5, 9.0, 9.0, 8.5, 8.0, 7.5, 7.0, 6.5, 8.0, 8.5, 9.0, 9.5]
    power: [8.6, 8.2, 8.7, 8.3, 8.4, 8.3, 8.0, 6.8, 8.5, 8.7, 8.6, 8.9]
  greenhouse horticulture:
    gas:   [14.0, 12.5, 11.0, 8.0, 5.5, 3.5, 3.0, 3.0, 5.0, 8.0, 12.0, 14.5]
    power: [12.0, 11.0, 10.0, 7.5, 5.5, 4.5, 4.5, 5.0, 6.5, 9.0, 11.5, 13.0]
  offices:
    gas:   [16.0, 14.0, 12.0, 8.0, 4.0, 2.0, 1.5, 1.5, 3.0, 8.0, 13.0, 17.0]
    power: [9.0, 8.5, 8.6, 8.0, 7.8, 8.0, 8.2, 7.4, 8.1, 8.6, 8.8, 9.0]

consumption_input:
  max_missing_months: 3           # 1-3 missing months are filled from the sector profile; more is an error

backtest:
  years: [2021, 2022, 2023, 2024, 2025]
  n_paths: 4000                   # fewer scenarios than the CLI: 30+ re-fits per run
  risk_aversions: [0.3, 0.5, 0.8]
  decision_months: [6, 7, 8, 9, 10, 11]   # as-of = last day of these months in year Y-1
  typical_month: 10               # "fix 100% once a year" renewal month
  pitch_year: 2022
  policy_gamma: 0.5               # risk aversion used by the HedgeWise policy and ladder
  ladder_base: 0.40               # HedgeWise ladder: share bought in H2 of Y-2
  ladder_max_step: 0.10           # ladder target <= previous season's target + 10 points
                                  # (ladder designed AFTER seeing the 2021-2025 results: not independent evidence)

validation:                       # out-of-sample test of the price model (python validation.py)
  first_origin: "2020-06-30"      # first forecast date (month ends from here to the last complete horizon)
  horizons_months: [1, 3, 12]     # forecast the average price over the next 1, 3 and 12 months
  n_paths: 2000                   # scenarios per forecast (CRPS sampling noise << differences between variants)
  seed: 7
  bootstrap_block_days: 30        # block length of the historical block bootstrap benchmark
  # Pre-registered selection rule (set BEFORE seeing results): among the model variants (a-d), the default becomes
  # the one with the lowest mean 12-month CRPS relative to the current model (average over gas and power), if it is
  # more than crps_margin better AND its 5-95% coverage at 12 months is within coverage_ok for both commodities.
  # Otherwise the current model stays. The bootstrap (e) is a benchmark only.
  crps_margin: 0.03
  coverage_ok: [0.80, 0.95]

app:
  scenario_choices: [2000, 5000, 10000]
  default_scenarios: 5000

green:                            # green investments as a hedge (hedgewise/green.py)
  hourly_shape:
    lookback_months: 36           # hourly price shapes from the last 36 complete months of data/power_nl_hourly.csv
                                  # (post-2022 market with today's solar build-out; 15-min data averaged per hour)
  load_profile: flat              # ASSUMPTION: power use spread evenly over the 24 hours of every day (a 24/7
                                  # food processor). "daytime" = 70% of the volume between 07:00 and 19:00 local time
  daytime_share: 0.70             # ASSUMPTION, used only with load_profile: daytime
  solar:
    capex_eur_per_kwp: 650        # ASSUMPTION: Dutch commercial rooftop PV 2025-26, turnkey, excl. SDE++ subsidy
                                  # (order of magnitude of quotes for 0.5-2 MWp roofs; replace with a real quote)
    opex_pct_of_capex: 1.5        # ASSUMPTION: maintenance + insurance, % of capex per year
    lifetime_years: 25            # ASSUMPTION: typical module warranty period
    export_value_share: 0.80      # exported power earns 80% of the day-ahead price (prompt spec; ASSUMPTION for the
                                  # supplier's feed-in terms: imbalance and profile cost deducted)
    sun_hours_cet:                # ASSUMPTION: production window per month in local clock time (sunrise+1h to
                                  # sunset-1h, rounded, ~51 N), with a sine-shaped day profile peaking at solar noon
      - [9, 16]
      - [8, 17]
      - [8, 18]
      - [8, 20]
      - [7, 21]
      - [6, 21]
      - [7, 21]
      - [7, 20]
      - [8, 19]
      - [9, 18]
      - [8, 16]
      - [9, 16]
  battery:
    capex_eur_per_kwh: 350        # ASSUMPTION: commercial lithium-ion (LFP) incl. inverter and installation, 2025-26
    opex_pct_of_capex: 1.0        # ASSUMPTION: % of capex per year
    lifetime_years: 15            # ASSUMPTION: ~5,000 cycles at one cycle a day
    round_trip_efficiency: 0.88   # prompt spec (typical for LFP systems)
    cycles_per_day: 1             # simple daily strategy: charge in the cheapest hours, discharge in the dearest
    peak_tariff_eur_per_kw_year: 40   # ASSUMPTION: grid capacity charge (kW-max) per kW per year, large-business
                                      # tariff order of magnitude; network cost, outside the commodity bill
    peak_shaving_share: 0.5       # ASSUMPTION: share of battery power that reliably cuts the monthly peak
  ppa:
    price_eur_mwh: null           # null = today's fixed power price (no discount: a PPA is then exactly a long
                                  # fixed-price hedge). Enter a real quote to compare.
    shape: baseload               # ASSUMPTION: the PPA volume follows the company's load profile (no shape risk)
  annuity_rate: 0.05              # ASSUMPTION: cost of capital used to turn capex into a yearly cost

market:                           # market size (market.py, MARKET.md). Sources: CBS StatLine open data (OData v3)
  tables:
    firms: "81589NED"             # Bedrijven; bedrijfstak - number of companies by SBI and size class (werkzame personen)
    firms_period: "2026KW03"      # latest quarter with final-ish counts when this was written
    establishments: "81578NED"    # Vestigingen van bedrijven; bedrijfstak, regio - for the Limburg share
    establishments_period: "2026JJ00"
    jobs: "83583NED"              # Banen van werknemers; bedrijfsgrootte en economische activiteit (SBI2008)
    jobs_period: "2024JJ00"
    energy: "83989NED"            # Energiebalans; aanbod en verbruik, sector
    energy_period: "2024JJ00"     # last definitive year (2025 is 'nader voorlopig')
  region_nl: "NL01"
  region_limburg: "PV31"          # Limburg (PV)
  size_classes: ["10-20", "20-50", "50-100", "100-250"]   # target: 10-250 werkzame personen
  # ASSUMPTION: typical number of working persons in a company of each size class (used to spread a sector's energy
  # use over its companies in proportion to their size; checked against CBS jobs per company in MARKET.md)
  class_midpoint_persons: {"1": 1, "2": 2, "3-5": 4, "5-10": 7, "10-20": 14, "20-50": 32, "50-100": 70,
                           "100-250": 155, "250+": 600}
  sme_energy_intensity: 1.0       # ASSUMPTION: energy per person in a 10-250 company relative to the sector average.
                                  # 1.0 = proportional to size (an UPPER bound: big plants are usually more energy-
                                  # intensive per person); MARKET.md also shows 0.5
  min_energy_gwh: 1.0             # ASSUMPTION: target only size classes whose estimated average gas + power use is at
                                  # least 1 GWh/yr (below ~EUR 100k a year of energy, hedging advice is not worth a fee)
  # Energy-intensive sectors. firms = SBI keys in 81589NED/81578NED (summed); energy = sector key in 83989NED;
  # jobs = key in 83583NED, or null = estimate persons from firm counts x class midpoints (no jobs breakdown).
  sectors:
    - {name: "Food and drink (SBI 10-12)", firms: ["307610"], energy: "307610", jobs: "307610",
       region: ["307600", "311300", "312200"]}   # 81578NED has no 10-12 total: sum of 10, 11 and 12
    - {name: "Paper (SBI 17)", firms: ["317100"], energy: "317100", jobs: "317100"}
    - {name: "Chemicals (SBI 20)", firms: ["320700"], energy: "320700", jobs: "320700"}
    - {name: "Rubber and plastics (SBI 22)", firms: ["323700"], energy: "323700", jobs: "323700"}
    - {name: "Glass, ceramics, cement, concrete (SBI 23)", firms: ["324600"], energy: "324600", jobs: "324600"}
    - {name: "Basic metals (SBI 24)", firms: ["328100"], energy: "E007206", jobs: "328100"}
    - {name: "Metal products (SBI 25)", firms: ["330300"], energy: "330300", jobs: "330300"}
    - {name: "Greenhouse horticulture (SBI 0113x/0119x/0125x/0130x under glass)",
       firms: ["301404", "301604", "302004", "302008", "302504", "302506"], energy: "E007247", jobs: null}
  energy_prices_eur_mwh: {gas: 36.0, power: 87.0}   # 2025 average TTF / NL day-ahead (data/, RESULTS.md) -
                                                    # commodity cost only, no tax or network costs
  revenue:
    subscription_eur: 3000        # ASSUMPTION (prompt): yearly subscription per company
    eur_per_gwh: 150              # ASSUMPTION (prompt): plus EUR 150 per GWh of gas + power consumed
    adoption: [0.01, 0.05, 0.10]  # ASSUMPTION (prompt): share of target companies that subscribe

extract:                          # reading invoices and contracts (extract.py). AI only READS; it never advises.
  ai_model: "claude-opus-5-5"     # Anthropic model for engine (b); used only with ANTHROPIC_API_KEY set AND the user's
                                  # explicit consent per upload ("send this document to the AI service")
  ai_effort: "medium"             # thinking depth for extraction (reading, not reasoning-heavy)
  ai_max_tokens: 16000
  spike_factor: 3.0               # flag a month that is more than 3x the median month
  price_range_eur_mwh: [1, 1000]  # flag prices outside this range (after unit conversion)

monitor:                          # monthly update (monitor.py, MONITORING.md); a person checks and sends it
  n_paths: 5000                   # scenarios per client per month
  bad_case_change: 0.15           # flag the bad case moving more than 15% since last month
  price_change: 0.20              # flag a fixed price moving more than 20% since last month
  overdue_tolerance: 0.01         # a planned tranche counts as overdue if more than 1 point is still missing
